---
layout: default
title: "Home"
permalink: /
---

<style>
  .hero {
    background: linear-gradient(135deg, #2c3e50, #3d566e);
    color: #fff;
    border-radius: 18px;
    padding: 36px;
    margin-bottom: 28px;
  }
  .hero .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; margin-bottom: 8px; }
  .hero h1 { margin: 0 0 18px; font-size: 26px; line-height: 1.35; max-width: 620px; }
  .hero .actions { display: flex; gap: 10px; }
  .hero button { padding: 9px 20px; border-radius: 999px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
  .hero .yes { background: #fff; color: #2c3e50; }
  .hero .no { background: rgba(255,255,255,0.15); color: #fff; }
  .hero .yes:hover { background: #eee; }
  .hero .no:hover { background: rgba(255,255,255,0.25); }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 860px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: #fff; border: 1px solid #e6e8eb; border-radius: 16px;
    padding: 18px; display: flex; flex-direction: column; gap: 12px; min-height: 220px;
  }
  .card h3 { margin: 0; font-size: 15px; }
  .card .sub { font-size: 12px; color: #6b7684; margin-top: -8px; }

  .leaderboard { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .leaderboard li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e6e8eb; }
  .leaderboard li:last-child { border-bottom: none; }
  .leaderboard .rank { color: #6b7684; width: 22px; }
  .leaderboard li.me { font-weight: 700; }

  .class-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; }
  .switch { position: relative; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #e6e8eb; border-radius: 999px; transition: 0.15s; }
  .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.15s; }
  .switch input:checked + .slider { background: #2c3e50; }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  .guide-thumb {
    background: linear-gradient(135deg, #2c3e50, #3d566e); border-radius: 12px; height: 110px;
    display: flex; flex-direction: column; justify-content: space-between; padding: 12px 14px;
    cursor: pointer; color: #fff;
  }
  .guide-thumb .subject-tag {
    align-self: flex-start; background: rgba(255,255,255,0.18); border-radius: 999px;
    padding: 3px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .guide-thumb .read-link { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; opacity: 0.9; }
  .guide-thumb .read-link .arrow { transition: transform 0.15s; }
  .guide-thumb:hover .read-link .arrow { transform: translateX(3px); }
  .creator { font-size: 12px; color: #6b7684; }
  .archive-rec { border-top: 1px solid #e6e8eb; padding-top: 10px; }
  .empty { font-size: 13px; color: #6b7684; }
</style>

<section class="hero" id="hero">
  <div class="eyebrow">Welcome back</div>
  <h1 id="hero-heading">Sign in to get a personalized study plan.</h1>
  <div class="actions" id="hero-actions" style="display:none;">
    <button class="yes" id="hero-yes">Yes, resume</button>
    <button class="no" id="hero-no">Not now</button>
  </div>
</section>

<section class="cards">
  <!-- Games temporarily hidden — re-add this card and the loadGamesCard() call below to re-enable
  <div class="card" id="games-card">
    <h3>Recently played</h3>
    <div class="sub" id="games-sub">Sign in to see your games</div>
    <div id="games-body" class="empty">Sign in to track your minigame scores.</div>
  </div>
  -->

  <div class="card" id="recommended-card">
    <h3>Recommended for you</h3>
    <div class="sub">Based on your classes and activity</div>
    <div id="recommended-body" class="empty">Sign in for a recommendation.</div>
  </div>
</section>

<script>
const API_BASE = "https://cornerstone-guides-backend.vercel.app";

async function authedFetch(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (window.clerkToken) headers["Authorization"] = `Bearer ${window.clerkToken}`;
  const res = await fetch(`${API_BASE}${path}`, Object.assign({}, opts, { headers }));
  if (!res.ok) throw new Error(`${path} -> ${res.status}`);
  return res.json();
}

window.addEventListener("clerk-ready", (e) => {
  if (e.detail.user) {
    loadHero();
    // loadGamesCard(); // Games temporarily hidden — uncomment to re-enable
    loadRecommendedCard();
  }
});

async function loadHero() {
  try {
    const last = await authedFetch("/api/student/activity/last");
    const heading = document.getElementById("hero-heading");
    const actions = document.getElementById("hero-actions");
    if (last) {
      const unit = last.unit_label ? `: ${last.unit_label}` : "";
      heading.textContent = `Get back to studying ${last.guide_title}${unit}?`;
      actions.style.display = "flex";
      document.getElementById("hero-yes").onclick = () => {
        window.location.href = `/guides/${last.guide_slug}`;
      };
      document.getElementById("hero-no").onclick = () => {
        heading.textContent = "No worries — here's what's new for you.";
        actions.style.display = "none";
      };
    } else {
      heading.textContent = `Welcome back, ${window.clerkUser?.firstName || "there"}! Pick a guide to get started.`;
      actions.style.display = "none";
    }
  } catch (err) {
    console.error(err);
  }
}

async function loadGamesCard() {
  const sub = document.getElementById("games-sub");
  const body = document.getElementById("games-body");
  try {
    const recent = await authedFetch("/api/student/games/recent");
    if (!recent) {
      body.innerHTML = `<div class="empty">You haven't played a minigame yet. Check out <a href="/games.html">Games</a>.</div>`;
      return;
    }
    sub.textContent = recent.game.title;
    const rows = recent.leaderboard.map((row, i) => {
      const isMe = window.clerkUser && row.student_id === window.clerkUser.id;
      const label = isMe ? "You" : (row.student_name || "Player");
      return `<li class="${isMe ? "me" : ""}"><span><span class="rank">${i + 1}.</span>${label}</span><span>${row.score}</span></li>`;
    }).join("");
    body.innerHTML = `<ul class="leaderboard">${rows}</ul>`;
  } catch (err) {
    console.error(err);
    body.innerHTML = `<div class="empty">Couldn't load your games.</div>`;
  }
}

async function loadRecommendedCard() {
  const body = document.getElementById("recommended-body");
  try {
    const data = await authedFetch("/api/student/recommended");
    const guide = data && data.guide;
    const archiveItem = data && data.archiveItem;
    if (!guide && !archiveItem) {
      body.innerHTML = `<div class="empty">No guides available yet.</div>`;
      return;
    }
    let html = "";
    if (guide) {
      html += `
        <div class="guide-thumb" id="rec-guide-thumb">
          <span class="subject-tag">${guide.subject || "Guide"}</span>
          <span class="read-link">Read guide <span class="arrow">→</span></span>
        </div>
        <div><strong>${guide.title}</strong></div>
        <div class="creator">By ${guide.author_username || "an editor"}</div>
      `;
    }
    if (archiveItem) {
      html += `
        <div class="archive-rec" id="rec-archive-item">
          <div class="sub" style="margin:10px 0 4px;">From the archive</div>
          <strong>${archiveItem.title}</strong>
          <div class="creator">${archiveItem.class_name ? archiveItem.class_name + " · " : ""}uploaded by ${archiveItem.uploader_username || "a student"}</div>
        </div>
      `;
    }
    body.innerHTML = html;
    const guideThumb = document.getElementById("rec-guide-thumb");
    if (guideThumb) guideThumb.addEventListener("click", () => { window.location.href = `/guides/${guide.slug}`; });
    const archiveEl = document.getElementById("rec-archive-item");
    if (archiveEl) { archiveEl.style.cursor = "pointer"; archiveEl.addEventListener("click", () => { window.location.href = `/archive#item-${archiveItem.id}`; }); }
  } catch (err) {
    console.error(err);
    body.innerHTML = `<div class="empty">Couldn't load a recommendation.</div>`;
  }
}
</script>
